{% extends 'base.html' %}
{% block content %}
<h2 class="titulo-pagina">Backlog de Instalações</h2>

<form method="get" class="form-filtro">
    <div class="filtros-bloco">
        <div class="filtros-linha">
            <div class="form-campo">
                <label for="data_inicio">Início:</label>
                <input type="date" id="data_inicio" name="data_inicio" value="{{ filtros.data_inicio }}" class="filtro-visual">
            </div>

            <div class="form-campo">
                <label for="data_fim">Fim:</label>
                <input type="date" id="data_fim" name="data_fim" value="{{ filtros.data_fim }}" class="filtro-visual">
            </div>

            <div class="form-campo">
                <label for="regional">Regional:</label>
                <select name="regional" id="regional" class="filtro-visual">
                    <option value="">Todas</option>
                    {% for r in filtros.regionais %}
                        <option value="{{ r }}" {% if r == filtros.regional %}selected{% endif %}>{{ r|title }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-campo">
                <label for="coordenador">Coordenador:</label>
                <select name="coordenador" id="coordenador" class="filtro-visual">
                    <option value="">Todos</option>
                    {% for c in filtros.coordenadores %}
                        <option value="{{ c }}" {% if c == filtros.coordenador %}selected{% endif %}>{{ c|title }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-campo dropdown-canal">
                <label for="canal">Canal:</label>
                <button type="button" class="filtro-visual canal-toggle" onclick="toggleDropdown()">Selecionar canais</button>
                <div id="canalDropdown" class="canal-dropdown">
                    {% for c in filtros.canais %}
                        <label><input type="checkbox" name="canal" value="{{ c }}" {% if c in filtros.canal %}checked{% endif %}> {{ c|title }}</label>
                    {% endfor %}
                </div>
            </div>

            <div class="form-campo">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" value="{{ filtros.cidade }}" class="filtro-visual">
            </div>

            <div class="form-campo">
                <label for="vendedor">Vendedor:</label>
                <input type="text" id="vendedor" name="vendedor" value="{{ filtros.vendedor }}" class="filtro-visual">
            </div>

            <div class="form-campo">
                <label style="visibility: hidden;">Filtrar</label>
                <button type="submit" class="btn-filtrar">Filtrar</button>
            </div>
        </div>
    </div>
</form>

<table>
    <thead>
        <tr>
            <th>Nome do Cliente</th>
            <th>Adesão</th>
            <th>Ativação</th>
        </tr>
    </thead>
    <tbody>
        {% for cliente in clientes %}
        <tr>
            <td>{{ cliente.nome }}</td>
            <td style="text-align: center;">{{ cliente.adesao }}</td>
            <td style="text-align: center;">{{ cliente.ativacao }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<style>
.filtros-bloco {
    border: 1px solid #d4af37;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 15px;
}
.filtros-linha {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
    justify-content: center;
}
.form-campo {
    display: flex;
    flex-direction: column;
    min-width: 160px;
    font-weight: bold;
    color: #f0c75e;
}
.filtro-visual {
    background-color: #0c0f18;
    color: #f0c75e;
    border: 1px solid #f0c75e;
    border-radius: 6px;
    padding: 6px 12px;
    font-weight: bold;
    width: 160px;
    margin-top: 4px;
    transition: 0.3s;
}
.filtro-visual:focus {
    outline: none;
    box-shadow: 0 0 6px #f0c75e;
}
.dropdown-canal {
    position: relative;
}
.canal-toggle {
    width: 160px;
}
.canal-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background-color: #111;
    border: 1px solid #d4af37;
    border-radius: 6px;
    padding: 10px;
    z-index: 100;
    display: grid;
    grid-template-columns: repeat(2, minmax(120px, 1fr));
    gap: 8px 20px;
    max-height: 200px;
    overflow-y: auto;
    width: max-content;
}
.canal-dropdown label {
    color: #eee;
    font-size: 14px;
}
.canal-dropdown input[type="checkbox"] {
    margin-right: 6px;
    accent-color: #d4af37;
}
.btn-filtrar {
    background-color: #d4af37;
    color: #000;
    font-weight: bold;
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    transition: 0.3s;
}
.btn-filtrar:hover {
    background-color: #c29c30;
    box-shadow: 0 0 6px #d4af37;
}
</style>

<script>
function toggleDropdown() {
    const dropdown = document.getElementById("canalDropdown");
    dropdown.style.display = dropdown.style.display === "grid" ? "none" : "grid";
}
window.addEventListener("click", function(e) {
    const dropdown = document.getElementById("canalDropdown");
    const toggleBtn = document.querySelector(".canal-toggle");
    if (!dropdown.contains(e.target) && !toggleBtn.contains(e.target)) {
        dropdown.style.display = "none";
    }
});
</script>
{% endblock %}
